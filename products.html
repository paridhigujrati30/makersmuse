<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Products – Maker’s Muse</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body class="products">

<header class="header">
    <h1>Our Decorative Items</h1>
    <a href="index.html" class="btn back-btn">⬅ Home</a>
    <a href="products.html" class="btn">Products</a>
    <a href="cart.html" class="btn">Cart</a>
    <a href="contact.html" class="btn">Contact</a>
    <a href="feedback.html" class="btn">Feedback</a>
</header>

</header>

<div class="product-grid">
    <div class="card">
        <img src="lantern.webp">
        <h2>Pink & White Floral Lantern</h2>
        <p>₹699</p>
        <button class="btn" onclick="addToCart('Floral Lantern',699)">Add to Cart</button>
    </div>

    <div class="card">
        <img src="string_lights.webp">
        <h2>Golden LED String Lights</h2>
        <p>₹399</p>
        <button class="btn" onclick="addToCart('LED String Lights',399)">Add to Cart</button>
    </div>

    <div class="card">
        <img src="table_decor.webp">
        <h2>Golden Table Decor</h2>
        <p>₹599</p>
        <button class="btn" onclick="addToCart('Golden Table Decor',599)">Add to Cart</button>
    </div>

    <div class="card">
        <img src="flowervase.webp">
        <h2>White Flower Vase</h2>
        <p>₹399</p>
        <button class="btn" onclick="addToCart('Golden Flower Vase',399)">Add to Cart</button>
    </div>

    <div class="card">
    <img src="wallhanging.jpg" alt="Boho Wall Hanging">
    <h2>Boho Wall Hanging</h2>
    <p>₹899</p>
    <button class="btn" onclick="addToCart('Boho Wall Hanging', 899)">
        Add to Cart
    </button>
</div>

<div class="card">
    <img src="scentedcandles.jpg" alt="Scented Candle Set">
    <h2>Scented Candle Set</h2>
    <p>₹499</p>
    <button class="btn" onclick="addToCart('Scented Candle Set', 499)">
        Add to Cart
    </button>
</div>

</div>

</body>
</html>
